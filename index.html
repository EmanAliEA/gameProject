<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awesome Game Co.</title>
  <style>
    body {
      font-family: 'Comic Sans MS', sans-serif;
      margin: 0;
      background-color: #f0f8ff;
      color: #333;
    }

    header {
      background: #dbc74b;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .hero {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 40px;
      gap: 20px;
      background: #6157ff;
      color: white;
    }

    .hero img {
      border-radius: 20px;
      width: 100%;
      max-width: 200px;
    }

    .video-box {
      width: 100%;
      max-width: 500px;
      height: 280px;
      background: #000;
      border-radius: 20px;
    }

    .benefits {
      padding: 50px 20px;
      text-align: center;
    }

    .benefit-cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      width: 250px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    footer {
      background: #333;
      color: white;
      padding: 40px 20px;
      text-align: center;
    }

    .other-games {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .other-games img {
      width: 105px;
      height: 105px;
      border-radius: 10px;
      transition: transform 0.3s;
    }

    .other-games img:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body>
  <header>
    <h1>🚀 Super Fun Games Studio</h1>
  </header>

  <section class="hero">
    <div>
      <img src="assests/WhatsApp_Image_2026-01-10_at_5.55.33_PM-removebg-preview.png" alt="Game Screenshot" />
    </div>
    <div class="video-box">
      <iframe width="100%" height="100%" src="assests/WhatsApp Video 2026-01-10 at 5.55.14 PM.mp4" frameborder="0"
        allowfullscreen style="border-radius: 20px"></iframe>
    </div>
  </section>

  <section class="benefits">
    <h2>Benefits 🌟</h2>
    <div class="benefit-cards">
      <div class="card">
        <h3>Gross motor skills 🏃‍♂️</h3>
        <!-- <p>Earn stars to unlock cool gear!</p> -->
      </div>
      <div class="card">
        <h3>Imagination boost ✨</h3>
        <!-- <p>Keep your brain sharp and happy.</p> -->
      </div>
      <div class="card">
        <h3>Hand-eye coordinati on 🎯</h3>
        <!-- <p>Built with child safety in mind.</p> -->
      </div>
    </div>
  </section>

  <footer>
    <h3>More Games from Us</h3>
    <div class="other-games">
      <img src="assests/WhatsApp Image 2026-01-10 at 6.06.32 PM (1).jpeg" alt="Game 2" />
      <img src="assests/WhatsApp Image 2026-01-10 at 6.06.32 PM (2).jpeg" alt="Game 3" />
      <img src="assests/WhatsApp Image 2026-01-10 at 6.06.32 PM.jpeg" alt="Game 4" />
      <img src="assests/WhatsApp Image 2026-01-10 at 6.06.33 PM.jpeg" alt="Game 5" />
    </div>
    <p>&copy; 2025 Super Fun Games Studio</p>
  </footer>
</body>

</html>
